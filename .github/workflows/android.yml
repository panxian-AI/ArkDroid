name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: 准备 SDK（用 runner 自带的，别指望第三方 action）
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: 同步 ArkBridge（唯一来源）
        run: python tools/sync_arkbridge.py

      - name: Python 层自测
        run: python tools/selftest_python.py

      - name: 构建 APK
        env:
          ARKDROID_BUILD_PYTHON: python
        run: bash ./gradlew --no-daemon assembleDebug assembleRelease

      - name: 报告产物
        run: |
          find app/build/outputs/apk -name "*.apk" -printf "%p  %k KB\n"

      - uses: actions/upload-artifact@v4
        with:
          name: arkdroid-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ArkDroid ${{ github.ref_name }}

            debug 包已签名，直接装；release 包未签名（需要自己的 keystore）。
            安装前建议先在 Termux 里跑一次 `termux-setup-storage`。
